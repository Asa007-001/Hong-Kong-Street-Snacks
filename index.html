<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>港味小吃｜互動電子書</title>
<style>
:root { --peach:#f8cdb8; --ink:#50372d; --dark:#30231f; }
* { box-sizing:border-box; }
body {
  margin:0; min-height:100vh; color:var(--ink);
  font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;
  background:radial-gradient(ellipse at top,#fff4ed 0%,#f3d6c8 55%,#e9c2ae 100%);
  display:flex; flex-direction:column; align-items:center;
}
header { text-align:center; padding:25px 16px 10px; }
h1 { margin:0; font-size:clamp(24px,4vw,34px); letter-spacing:.12em; }
.subtitle { margin:8px 0 0; color:#8a6555; font-size:14px; letter-spacing:.08em; }
main { width:100%; display:flex; flex:1; align-items:center; justify-content:center; padding:14px 16px 8px; }
.book-wrap { width:min( min(76vw, 520px), calc((100vh - 205px) * .707)); }
.book {
  position:relative; width:100%; aspect-ratio:1414/2000;
  perspective:1800px; filter:drop-shadow(0 18px 24px rgba(80,45,30,.22));
}
.page-under, .page-front, .page-back {
  position:absolute; inset:0; border-radius:5px 13px 13px 5px;
  overflow:hidden; background:var(--peach);
}
.page-under img, .page-front img, .page-back img { width:100%; height:100%; object-fit:fill; display:block; }
.page-under { box-shadow:inset 7px 0 10px rgba(80,45,30,.10); }
.page-front {
  transform-origin:left center; transform-style:preserve-3d;
  z-index:3; box-shadow:inset 7px 0 12px rgba(80,45,30,.13);
}
.page-front.turn-next { animation:turnNext .68s ease-in-out forwards; }
.page-front.turn-prev { animation:turnPrev .68s ease-in-out forwards; }
.page-front img { backface-visibility:hidden; }
.page-back {
  position:absolute; inset:0; transform:rotateY(180deg);
  backface-visibility:hidden; background:#f8cdb8;
}
@keyframes turnNext {
  0% { transform:rotateY(0deg); }
  100% { transform:rotateY(-180deg); }
}
@keyframes turnPrev {
  0% { transform:rotateY(0deg); }
  100% { transform:rotateY(180deg); }
}
.book::before {
  content:""; position:absolute; left:0; top:0; bottom:0; width:9px; z-index:5;
  background:linear-gradient(90deg,rgba(90,48,30,.18),rgba(255,255,255,.15),transparent);
  pointer-events:none;
}
.controls { display:flex; align-items:center; justify-content:center; gap:16px; padding:10px 16px 22px; }
button {
  border:0; border-radius:999px; padding:12px 22px; min-width:112px;
  color:#fffaf6; background:#9b6048; font-size:16px; font-weight:600;
  cursor:pointer; box-shadow:0 4px 10px rgba(80,45,30,.18);
  transition:transform .15s, background .15s;
}
button:hover { background:#754633; transform:translateY(-2px); }
button:disabled { opacity:.35; cursor:not-allowed; transform:none; }
.counter { min-width:76px; text-align:center; font-weight:700; color:#704a3a; font-variant-numeric:tabular-nums; }
.hint { padding:0 12px 18px; color:#8a6555; font-size:12px; text-align:center; }
@media(max-width:600px) {
  header { padding-top:18px; }
  .book-wrap { width:min(88vw, calc((100vh - 205px) * .707)); }
  .controls { gap:9px; padding-bottom:16px; }
  button { min-width:0; padding:11px 16px; font-size:14px; }
}
@media(prefers-reduced-motion:reduce) {
  .page-front.turn-next,.page-front.turn-prev { animation-duration:.01ms; }
}
</style>
</head>
<body>
<header>
  <h1>港味小吃</h1>
  <p class="subtitle">HONG KONG FOOD · INTERACTIVE E-BOOK</p>
</header>
<main>
  <div class="book-wrap">
    <div class="book" aria-label="港味小吃電子書">
      <div class="page-under"><img id="underPage" src="images/2.png" alt="下一頁"></div>
      <div class="page-front" id="frontPage">
        <img id="frontImage" src="images/1.png" alt="第 1 頁">
        <div class="page-back"></div>
      </div>
    </div>
  </div>
</main>
<nav class="controls" aria-label="翻頁控制">
  <button id="prevBtn" type="button" disabled>← 上一頁</button>
  <span class="counter" id="counter" aria-live="polite">1 / 19</span>
  <button id="nextBtn" type="button">下一頁 →</button>
</nav>
<div class="hint">使用下方按鈕翻頁，也可以使用鍵盤 ← → 方向鍵</div>
<script>
(() => {
  const total = 19;
  let current = 1;
  let busy = false;
  const front = document.getElementById('frontPage');
  const frontImage = document.getElementById('frontImage');
  const underImage = document.getElementById('underPage');
  const counter = document.getElementById('counter');
  const prev = document.getElementById('prevBtn');
  const next = document.getElementById('nextBtn');

  function imagePath(page) { return `images/${page}.png`; }
  function updateControls() {
    counter.textContent = `${current} / ${total}`;
    prev.disabled = current === 1 || busy;
    next.disabled = current === total || busy;
  }
  function turn(direction) {
    if (busy || (direction === 1 && current === total) || (direction === -1 && current === 1)) return;
    busy = true;
    const target = current + direction;
    underImage.src = imagePath(target);
    front.classList.remove('turn-next','turn-prev');
    void front.offsetWidth;
    front.classList.add(direction === 1 ? 'turn-next' : 'turn-prev');
    updateControls();
    window.setTimeout(() => {
      current = target;
      frontImage.src = imagePath(current);
      frontImage.alt = `第 ${current} 頁`;
      front.classList.remove('turn-next','turn-prev');
      // Reset the page's transform before the next turn.
      front.style.transform = 'none';
      void front.offsetWidth;
      front.style.transform = '';
      underImage.src = imagePath(Math.min(total, current + 1));
      busy = false;
      updateControls();
    }, 690);
  }
  prev.addEventListener('click', () => turn(-1));
  next.addEventListener('click', () => turn(1));
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') turn(1);
    if (e.key === 'ArrowLeft') turn(-1);
  });
  updateControls();
})();
</script>
</body>
</html>
